.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: .84rem; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 4px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }

.chip .n { color: var(--muted); font-family: var(--mono); font-size: .76rem; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--bg); }

.status { color: var(--muted); font-size: .84rem; }

.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.panel header { display: grid; gap: 2px; }
.panel .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel .count { font-family: var(--mono); font-size: .8rem; color: var(--muted); white-space: nowrap; }
.panel .note { color: var(--muted); font-size: .82rem; margin: 0; }
.cards { display: grid; gap: 8px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .panel.wide { grid-column: span 2; } .panel.wide .cards { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1180px) { .panel.wide .cards { grid-template-columns: 1fr 1fr; } }

.card { display: grid; gap: 6px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 10px; color: var(--ink); text-decoration: none; min-width: 0; }
a.card:hover { border-color: var(--accent); }
.card.guess { border-style: dashed; border-color: var(--warn); }
.card .title { font-weight: 500; overflow-wrap: anywhere; }
.card .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: .76rem; color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 5px; }
.tag i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.q { color: var(--warn); font-weight: 700; }
.empty { color: var(--muted); padding: 24px 0; }
.area { grid-column: 1 / -1; padding: 10px 2px 0; border-top: 1px solid var(--line); }
.area h2 { font-size: 1.15rem; }
.area .note { color: var(--muted); font-size: .84rem; margin: 2px 0 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

const state = { team: "", q: "", guess: false };
const $ = (id) => document.getElementById(id);
const urlOf = (id) => !id ? "" : (id.length === 36 && id.indexOf("-") > 0
  ? "https://claude.ai/code/artifact/" + id : "https://claude.ai/artifact/" + id);
const dateOf = (d) => !d ? "" : (d + "").replace("-", "/");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function buildChips() {
  const box = $("teams");
  const all = el("button", "chip"); all.type = "button"; all.dataset.team = ""; all.setAttribute("aria-pressed", "true");
  all.append("All teams ", Object.assign(el("span", "n"), { textContent: R.length }));
  box.append(all);
  for (const k of Object.keys(TEAMS)) {
    const b = el("button", "chip"); b.type = "button"; b.dataset.team = k; b.setAttribute("aria-pressed", "false");
    const dot = el("i"); dot.style.background = "var(" + TEAMS[k][1] + ")";
    const n = R.filter((r) => r[3] === k).length;
    b.append(dot, TEAMS[k][0] + " ", Object.assign(el("span", "n"), { textContent: n }));
    box.append(b);
  }
  box.addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    state.team = b.dataset.team;
    box.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", c === b ? "true" : "false"));
    render();
  });
}

function render() {
  const wall = $("wall"); wall.textContent = "";
  const q = state.q.trim().toLowerCase();
  let shown = 0;
  let lastArea = "";
  for (const [key, name, note, wide, area] of CH) {
    const all = R.filter((r) => r[2] === key);
    const rows = all.filter((r) => (!state.team || r[3] === state.team) && (!q || r[1].toLowerCase().includes(q)) && (!state.guess || r[5]));
    if (!rows.length) continue;
    if (area !== lastArea) {
      lastArea = area;
      const A = AREAS.find((a) => a[0] === area);
      const ah = el("div", "area");
      ah.append(el("h2", "", A[1]), el("p", "note", A[2]));
      wall.append(ah);
    }
    shown += rows.length;
    const p = el("section", "panel" + (wide ? " wide" : ""));
    const h = el("header");
    const top = el("div", "top");
    top.append(el("h2", "", name), el("span", "count", rows.length === all.length ? String(all.length) : rows.length + " / " + all.length));
    h.append(top, el("p", "note", note));
    const cards = el("div", "cards");
    for (const r of rows) {
      const href = r[6] && r[6].length ? "view.html?id=" + encodeURIComponent(r[0]) : "";
      const c = el(href ? "a" : "div", "card" + (r[5] ? " guess" : ""));
      if (href) { c.href = href;  }
      c.append(el("span", "title", r[1]));
      const meta = el("span", "meta");
      const tag = el("span", "tag"); const sq = el("i"); sq.style.background = "var(" + TEAMS[r[3]][1] + ")";
      tag.append(sq, TEAMS[r[3]][0]);
      meta.append(tag);
      if (r[4]) meta.append(Object.assign(el("span", "mono"), { textContent: dateOf(r[4]) }));
      if (r[5]) { const g = el("span", "q", "? guessed"); meta.append(g); }
      if (!href) meta.append(el("span", "", "no file"));
      c.append(meta); cards.append(c);
    }
    p.append(h, cards); wall.append(p);
  }
  if (!shown) wall.append(el("p", "empty", "No cards match. Clear the search or pick another team."));
  $("status").textContent = shown + " of " + R.length + " cards";
}

$("sub").textContent = R.length + " artifacts in " + AREAS.length + " areas and " + CH.filter((c) => R.some((r) => r[2] === c[0])).length + " channels, each tagged with the team that works on it.";
$("guessN").textContent = R.filter((r) => r[5]).length;
if (!R.some((r) => r[5])) $("guessOnly").style.display = "none";
buildChips();
$("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
$("guessOnly").addEventListener("click", (e) => { state.guess = !state.guess; e.currentTarget.setAttribute("aria-pressed", String(state.guess)); render(); });
render();
</script>
